spring.application.name=fairliving-backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fairliving}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:fairliving}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:fairliving}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.liquibase.change-log=classpath:db/master.xml

