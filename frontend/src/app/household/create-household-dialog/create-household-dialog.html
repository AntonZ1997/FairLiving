<h2 mat-dialog-title>Haushalt erstellen</h2>

<form [formGroup]="form" (ngSubmit)="confirm()">
  <mat-dialog-content>
    <mat-form-field appearance="outline">
      <mat-label>Name</mat-label>
      <input matInput type="text" formControlName="name" />
      @if (form.controls.name.hasError('maxlength')) {
        <mat-error>Höchstens 100 Zeichen.</mat-error>
      }
    </mat-form-field>

    @if (errorMessage()) {
      <p class="error" role="alert">{{ errorMessage() }}</p>
    }
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" [disabled]="creating()" (click)="cancel()">Abbrechen</button>
    <button mat-flat-button type="submit" [disabled]="form.invalid || creating()">
      {{ creating() ? 'Anlegen…' : 'Anlegen' }}
    </button>
  </mat-dialog-actions>
</form>
